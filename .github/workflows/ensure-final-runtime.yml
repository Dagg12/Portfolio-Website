name: Ensure final portfolio runtime
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  ensure-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load final runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          tag='<script src="portfolio-final-runtime.js?v=20260906-final"></script>'
          if tag not in text:
              text=text.replace('</body>', f'  {tag}\n</body>')
              p.write_text(text,encoding='utf-8')
          PY
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Load final portfolio enhancement runtime'
          git push