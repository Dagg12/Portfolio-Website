name: Portfolio reliability fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ensure-runtime-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure reliability script is loaded
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="site-fix.js"></script>'
          if tag not in text:
              marker = '<script src="script.js"></script>'
              if marker in text:
                  text = text.replace(marker, marker + '\n    ' + tag, 1)
              else:
                  text = text.replace('</body>', '    ' + tag + '\n</body>', 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit reliability fix
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix portfolio section visibility and navigation"
          git push
