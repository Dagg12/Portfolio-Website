name: Load dramatic portfolio background
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject dramatic runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="dramatic-bg.js"></script>'
          if tag not in s:
              s=s.replace('</body>', f'  {tag}\n</body>')
              p.write_text(s, encoding='utf-8')
          PY
          if git diff --quiet -- index.html; then
            echo 'Dramatic runtime already loaded.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Add dramatic live cyber background runtime'
            git push
          fi
